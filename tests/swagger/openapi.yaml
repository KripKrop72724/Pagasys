  /api/companies/{company_id}/att-adjustments/:
    get:
      operationId: companies_att_adjustments_list
      description: 'Compound filtering is supported. Example: ?employee=<value>&date=<value>'
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: date
        schema:
          type: string
        description: Filter by date. Combine multiple parameters for compound filtering.
        examples:
          Example:
            value: <value>
      - in: query
        name: employee
        schema:
          type: string
        description: Filter by employee. Combine multiple parameters for compound
          filtering.
        examples:
          Example:
            value: <value>
      - in: query
        name: ordering
        schema:
          type: string
        description: Comma-separated list of fields to sort by
