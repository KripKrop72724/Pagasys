components:
  schemas:
    Action983Enum:
      enum:
      - in
      - out
      - auto
      type: string
      description: |-
        * `in` - in
        * `out` - out
        * `auto` - auto
    AttAdjustment:
      type: object
      description: |-
        Manual, additive deltas applied after computation. Negative values reduce
        totals. Set `override_status` to replace the computed AttDay.status.
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
          description: Employee ID
        date:
          type: string
          format: date
          description: Roster date the adjustment applies to
        delta_work_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to work_min
        delta_unpaid_break_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to unpaid_break_min
        delta_paid_break_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to paid_break_min
        delta_ot_regular_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to ot_regular_min
        delta_ot_night_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to ot_night_min
        delta_ot_holiday_min:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Additive minutes applied to ot_holiday_min
        override_status:
          type: string
          description: Override computed status (e.g. 'present')
          maxLength: 16
        reason:
          type: string
          description: Human-readable reason for the adjustment
          maxLength: 255
        created_by_id:
          type: integer
          readOnly: true
          description: Identifier of the user who created the adjustment. Set automatically
            from the authenticated user.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_id
      - date
      - employee
      - id
      - reason
    AttDay:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        anomalies:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
          description: Counts keyed by canonical anomaly names (e.g. unpaired_out,
            missing_out_closed_at_next_in, missing_out, auto_closed, capped, face_required_no_match,
            geofence_rule_violation, outside_scope, overtime_over_cap, break_auto_deduct_*,
            manual_adjustments_applied). Keys like 'break_auto_deduct_<rule_id>' use
            a rule-specific suffix.
        date:
          type: string
          format: date
          readOnly: true
        work_min:
          type: integer
          readOnly: true
          description: Net work minutes after unpaid breaks and deductions
        unpaid_break_min:
          type: integer
          readOnly: true
          description: Total unpaid break minutes deducted from work_min
        paid_break_min:
          type: integer
          readOnly: true
          description: Paid break minutes that do not reduce work_min
        late_min:
          type: integer
          readOnly: true
          description: Minutes late beyond shift start after grace
        early_leave_min:
          type: integer
          readOnly: true
          description: Minutes left early before shift end after grace
        ot_regular_min:
          type: integer
          readOnly: true
          description: Overtime minutes outside night/holiday buckets
        ot_night_min:
          type: integer
          readOnly: true
          description: Overtime minutes classified as night
        ot_holiday_min:
          type: integer
          readOnly: true
          description: Overtime minutes worked on holidays
        is_holiday:
          type: boolean
          readOnly: true
        is_rest_day:
          type: boolean
          readOnly: true
        on_leave:
          type: boolean
          readOnly: true
        leave_portion:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          description: Portion of the day covered by approved leave (0-1)
        status:
          allOf:
          - $ref: '#/components/schemas/AttDayStatusEnum'
          readOnly: true
          description: |-
            Final attendance status consumed by payroll and reports

            * `present` - present
            * `absent` - absent
            * `leave` - leave
            * `holiday` - holiday
            * `rest` - rest
            * `partial` - partial
        pairs_count:
          type: integer
          readOnly: true
          description: Number of AttPair sessions contributing to this day
        punches_used:
          type: integer
          readOnly: true
          description: Total punch events used to build the pairs
        compute_version:
          type: integer
          readOnly: true
          description: Internal algorithm version used for this compute
        computed_at:
          type: string
          format: date-time
          readOnly: true
        locked:
          type: boolean
          readOnly: true
          description: Freeze this day to prevent recomputation or adjustments
        employee:
          type: integer
          readOnly: true
        shift:
          type: integer
          readOnly: true
          nullable: true
        roster:
          type: integer
          readOnly: true
          nullable: true
      required:
      - anomalies
      - compute_version
      - computed_at
      - date
      - early_leave_min
      - employee
      - id
      - is_holiday
      - is_rest_day
      - late_min
      - leave_portion
      - locked
      - on_leave
      - ot_holiday_min
      - ot_night_min
      - ot_regular_min
      - paid_break_min
      - pairs_count
      - punches_used
      - roster
      - shift
      - status
      - unpaid_break_min
      - work_min
    AttDayStatusEnum:
      enum:
      - present
      - absent
      - leave
      - holiday
      - rest
      - partial
      type: string
      description: |-
        * `present` - present
        * `absent` - absent
        * `leave` - leave
        * `holiday` - holiday
        * `rest` - rest
        * `partial` - partial
    AttPair:
      type: object
      description: |-
        Paired IN/OUT session derived from punch events.

        'auto' punches open a new session when none is active or close the
        current session. Anomalies such as 'missing_out_closed_at_next_in'
        appear when a new IN arrives before an OUT.
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
          description: Roster date this pair belongs to
        in_event_id:
          type: integer
          readOnly: true
          description: ID of the originating IN punch event
        out_event_id:
          type: integer
          readOnly: true
          nullable: true
          description: ID of the OUT punch event, if any
        in_ts:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the IN punch
        out_ts:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp of the OUT punch, if any
        duration_min:
          type: integer
          readOnly: true
          description: Minutes between in_ts and out_ts, capped per policy
        cross_midnight:
          type: boolean
          readOnly: true
          description: True if out_ts falls on the day after in_ts
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
          description: |-
            Origin of the pair; 'auto' punches open a new session or close the current one, while 'manual' pairs are entered by managers

            * `auto` - auto
            * `manual` - manual
        anomaly:
          readOnly: true
          description: 'Canonical anomalies detected for this pair, e.g. {''missing_out_closed_at_next_in'':
            true}'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        employee:
          type: integer
          readOnly: true
      required:
      - anomaly
      - created_at
      - cross_midnight
      - date
      - duration_min
      - employee
      - id
      - in_event_id
      - in_ts
      - out_event_id
      - out_ts
      - source
      - updated_at
    AttendanceDevice:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company:
          type: integer
          readOnly: true
          description: Owning company for the device
        name:
          type: string
          description: Human friendly device label
          maxLength: 120
        api_key:
          type: string
          readOnly: true
          description: Generated key supplied via the X-Device-Key header
        is_active:
          type: boolean
          description: Inactive devices may not submit punches
        branch:
          type: integer
          nullable: true
          description: Limit device usage to this branch
        department:
          type: integer
          nullable: true
          description: Limit device usage to this department
        project:
          type: integer
          nullable: true
          description: Limit device usage to this project
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Geofence latitude in decimal degrees
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          description: Geofence longitude in decimal degrees
        radius_m:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          description: Geofence radius in metres
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Last time the device contacted the API
        note:
          type: string
          description: Internal note
          maxLength: 255
      required:
      - api_key
      - company
      - id
      - last_seen
      - name
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      description: Serializer for Branch
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Branch office name
          maxLength: 255
        address:
          type: string
          description: Physical address of the branch
        company:
          type: integer
          description: Parent company
        work_calendar:
          type: integer
          nullable: true
          description: Specific work calendar for this branch
      required:
      - company
      - id
      - name
    BranchSerializerBulkCreateResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BulkError'
      required:
