          type: string
          description: Trade license name
          maxLength: 100
        establishment_card_number:
          type: string
          description: Establishment card number
          maxLength: 100
        license_document:
          type: string
          format: uri
          nullable: true
          description: Scanned copy of the trade license
          pattern: (?:pdf|jpg|jpeg|png)$
        issued_date:
          type: string
          format: date
          nullable: true
          description: Date license was issued
        expiry_date:
          type: string
          format: date
          nullable: true
          description: Date license expires
        max_visas:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Maximum number of visa slots
        company:
          type: integer
          description: License owning company
        branches:
          type: array
          items:
            type: integer
          description: Which branches this license covers. Leave empty for a company-wide
            license
      required:
      - company
