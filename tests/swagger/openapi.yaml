      type: object
      description: |-
        Serializer for Holiday.

        Editing or deleting a holiday triggers asynchronous recalculation of
        roster entries tied to the holiday's calendar. Manual ``is_holiday``
        overrides on those entries are preserved while ``was_holiday`` reflects
        the calendar's current state.
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          description: Holiday date
        name:
          type: string
          description: Holiday name
          maxLength: 255
        is_public:
          type: boolean
          description: Public vs company holiday
        calendar:
          type: integer
          description: Parent work calendar
      required:
      - calendar
      - date
      - id
      - name
