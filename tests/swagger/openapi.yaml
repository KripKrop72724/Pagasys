  /api/companies/{company_id}/roster/bulk-upsert/:
    post:
      operationId: companies_roster_bulk_upsert_create
      description: Atomically upsert roster entries. Dates coinciding with calendar
        holidays are automatically flagged with `is_holiday`, and `was_holiday` records
        that a holiday was scheduled. Include `is_holiday` in an entry to explicitly
        override the default.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterBulkUpsertRequest'
            examples:
              UpsertExample:
                value:
                  entries:
                  - employee: 1
                    date: '2024-07-04'
                    shift: 1
                  - employee: 1
                    date: '2024-07-05'
                    shift: 1
                    is_holiday: false
                summary: Upsert example
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RosterBulkUpsertRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RosterBulkUpsertRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterBulkUpsertResponse'
              examples:
                UpsertExample:
                  value:
                    entries:
                    - employee: 1
                      date: '2024-07-04'
                      shift: 1
                    - employee: 1
                      date: '2024-07-05'
                      shift: 1
                      is_holiday: false
                  summary: Upsert example
          description: ''
  /api/companies/{company_id}/roster/schedule-range/:
    post:
      operationId: companies_roster_schedule_range_create
      description: Create or update consecutive roster entries starting from `start_date`.
        Provide either `days` (number of days) or `until` (inclusive end date). `rest_weekdays`
        may list weekday codes such as ['SAT','SUN'] to mark rest days automatically.
        Entries on calendar holidays are flagged with `is_holiday`, and `was_holiday`
        records that a holiday was originally scheduled.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RosterRange'
            examples:
              ByDaysWithWeekendRest:
                value:
                  employee: 1
                  shift: 1
                  start_date: '2024-07-01'
                  days: 7
                  rest_weekdays:
                  - SAT
                  - SUN
                summary: By days with weekend rest
              MultipleEmployees:
                value:
                  employees:
                  - 1
                  - 2
                  shift: 1
                  start_date: '2024-07-01'
                  days: 3
                summary: Multiple employees
              UntilDate:
                value:
                  employee: 1
                  shift: 1
                  start_date: '2024-07-01'
                  until: '2024-07-31'
                summary: Until date
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RosterRange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RosterRange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRangeResult'
              examples:
                ByDaysWithWeekendRest:
                  value:
                    employee: 1
                    shift: 1
                    start_date: '2024-07-01'
                    days: 7
                    rest_weekdays:
                    - SAT
                    - SUN
                  summary: By days with weekend rest
                MultipleEmployees:
                  value:
                    employees:
                    - 1
                    - 2
                    shift: 1
                    start_date: '2024-07-01'
                    days: 3
                  summary: Multiple employees
                UntilDate:
                  value:
                    employee: 1
                    shift: 1
                    start_date: '2024-07-01'
                    until: '2024-07-31'
                  summary: Until date
                SuccessResponse:
                  value:
                    count: 31
                  summary: Success response
                AcceptedResponse:
                  value:
                    task_id: uuid
                  summary: Accepted response
          description: Count of roster entries created or updated
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterRangeTask'
          description: Task enqueued for asynchronous processing
