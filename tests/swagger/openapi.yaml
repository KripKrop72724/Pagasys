openapi: 3.0.3
info:
  title: Pagasys Payroll API
  version: 1.0.0
  description: Complete HR, payroll, and capture management for UAE companies
paths:
  /api/branches/:
    get:
      operationId: branches_list
      description: 'Compound filtering is supported. Example: ?company=<value>&name=<value>'
      parameters:
      - in: query
        name: address
        schema:
          type: string
        description: Filter by address. Combine multiple parameters for compound filtering.
        examples:
          Example:
            value: <value>
      - in: query
        name: company
        schema:
          type: string
        description: Filter by company. Combine multiple parameters for compound filtering.
        examples:
          Example:
            value: <value>
      - in: query
        name: name
        schema:
          type: string
        description: Filter by name. Combine multiple parameters for compound filtering.
        examples:
          Example:
            value: <value>
      - in: query
        name: ordering
        schema:
          type: string
        description: Comma-separated list of fields to sort by
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: work_calendar
        schema:
          type: string
        description: Filter by work_calendar. Combine multiple parameters for compound
          filtering.
        examples:
          Example:
            value: <value>
      tags:
      - branches
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBranchList'
          description: ''
    post:
      operationId: branches_create
      description: CRUD for branches
      tags:
      - branches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Branch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Branch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Branch'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
          description: ''
  /api/branches/{id}/:
    get:
      operationId: branches_retrieve
      description: CRUD for branches
      parameters:
