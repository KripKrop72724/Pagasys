      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttAdjustmentList'
              examples:
                Add30MinutesPaidBreakAndOverrideStatus:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - employee: 1
                      date: '2024-01-03'
                      delta_paid_break_min: 30
                      override_status: present
                      reason: Manager approved paid break
                  summary: Add 30 minutes paid break and override status
          description: ''
    post:
      operationId: companies_att_adjustments_create
      description: Create a manual attendance adjustment.
      parameters:
      - in: path
        name: company_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttAdjustment'
            examples:
              Request:
                value:
                  employee: 1
                  date: '2024-01-05'
                  delta_ot_regular_min: -30
                  override_status: present
                  reason: Reduce overtime by 30 minutes
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttAdjustment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttAdjustment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttAdjustment'
              examples:
                Response:
                  value:
                    id: 1
                    employee: 1
                    date: '2024-01-05'
                    delta_ot_regular_min: -30
                    override_status: present
                    reason: Reduce overtime by 30 minutes
                    created_by_id: 99
                    created_at: '2024-01-06T09:00:00Z'
          description: ''
