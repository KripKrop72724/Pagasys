services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ./entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pagasys
      POSTGRES_PASSWORD: pagasys
      POSTGRES_DB: pagasys
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagasys"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
