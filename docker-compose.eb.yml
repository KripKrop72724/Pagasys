services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    expose:
      - "8000"
    environment:
      # Pass-through (if set on the host via EB Environment Properties)
      - RUN_MIGRATIONS=0
      - DATABASE_URL
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - RDS_HOSTNAME
      - RDS_PORT
      - RDS_DB_NAME
      - RDS_USERNAME
      - RDS_PASSWORD
      - DJANGO_SETTINGS_MODULE
      - ENV
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${PORT:-8000}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ACME_EMAIL
      - APP_DOMAIN
    depends_on:
      - web

  redis:
    image: redis:7

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: >
      sh -lc '
      celery -A config.celery worker --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-2}
      -Q ${CELERY_QUEUES:-celery,compute}
      '
    environment:
      - DATABASE_URL
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - RDS_HOSTNAME
      - RDS_PORT
      - RDS_DB_NAME
      - RDS_USERNAME
      - RDS_PASSWORD
      - DJANGO_SETTINGS_MODULE
      - ENV
      - CELERY_QUEUES=celery,compute
      - CELERY_CONCURRENCY=2
    depends_on:
      - redis

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: celery -A config.celery beat --loglevel=info
    environment:
      - DATABASE_URL
      - DB_HOST
      - DB_PORT
      - DB_NAME
      - DB_USER
      - DB_PASSWORD
      - RDS_HOSTNAME
      - RDS_PORT
      - RDS_DB_NAME
      - RDS_USERNAME
      - RDS_PASSWORD
      - DJANGO_SETTINGS_MODULE
      - ENV
    depends_on:
      - redis

volumes:
  caddy_data:
  caddy_config:
