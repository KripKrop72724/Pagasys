name: CI/CD

on:
  push:
    branches: [ main ]

concurrency:
  group: pagasys-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  migrate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:           me-central-1
      - name: Run migrations in VPC
        id: run-migrations
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:elasticbeanstalk:environment-name,Values=pagasys-dev" \
            --document-name "AWS-RunShellScript" \
            --comment "Run Django migrations" \
            --parameters 'commands=[
              "cd /var/app/current",
              "nslookup $DB_HOST || { echo DB_HOST does not resolve; exit 1; }",
              "python - <<'PY'",
              "import os, socket, sys, time",
              "host = os.environ.get(\"DB_HOST\")",
              "port = int(os.environ.get(\"DB_PORT\", \"5432\"))",
              "if not host:",
              "    print(\"DB_HOST is not set\"); sys.exit(1)",
              "for _ in range(30):",
              "    try:",
              "        socket.create_connection((host, port), timeout=5).close()",
              "        print(\"Database is reachable\"); break",
              "    except socket.gaierror:",
              "        print(\"DB_HOST does not resolve\"); sys.exit(1)",
              "    except OSError as e:",
              "        print(f\"Waiting for database: {e}\"); time.sleep(2)",
              "else:",
              "    print(\"Database not reachable\"); sys.exit(1)",
              "PY",
              "python manage.py migrate --noinput --verbosity 2"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for migration command
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=pagasys-dev" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          aws ssm wait command-executed --command-id "${{ steps.run-migrations.outputs.command_id }}" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "${{ steps.run-migrations.outputs.command_id }}" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text


  deploy-to-eb:
    name: Deploy to Elastic Beanstalk
    needs: [lint-and-test, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:           me-central-1

      - name: Wait for EB environment to be ready
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-dev --query 'Environments[0].Status' --output text)
          while [ "$STATUS" != "Ready" ]; do
            echo "Environment status: $STATUS. Waiting..."
            sleep 20
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-dev --query 'Environments[0].Status' --output text)
          done
          echo "Environment is Ready."

      - name: Get current EB version
        id: prev-version
        run: |
          PREV_VERSION=$(aws elasticbeanstalk describe-environments --environment-names pagasys-dev --query 'Environments[0].VersionLabel' --output text)
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT


      - name: Use EB compose file
        run: mv docker-compose.eb.yml docker-compose.yml

      - name: Package application
        run: zip -r deployment-package.zip . -x '*.git*' '*.venv*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name:   pagasys-dev
          environment_name:   pagasys-dev
          version_label:      ${{ github.sha }}
          region:             me-central-1
          deployment_package: deployment-package.zip

      - name: Wait for deployment to finish
        run: aws elasticbeanstalk wait environment-updated --environment-name pagasys-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: |
          URL=$(aws elasticbeanstalk describe-environments \
            --environment-names pagasys-dev \
            --query "Environments[0].CNAME" --output text)
            for i in {1..15}; do
              if curl -fsS "http://$URL/healthz" > /dev/null && \
                 python manage.py shell -c "from django.db import connection; connection.cursor().execute('SELECT 1')"; then
                echo "Smoke test passed"; exit 0
              fi
              echo "Waiting for app... ($i/15)"; sleep 10
            done
            echo "Smoke test failed"; exit 1

      - name: Roll back on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Rolling back to version: ${{ steps.prev-version.outputs.version }}"
          aws elasticbeanstalk update-environment --environment-name pagasys-dev --version-label "${{ steps.prev-version.outputs.version }}"
          aws elasticbeanstalk wait environment-updated --environment-name pagasys-dev

      - name: Fail workflow if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1



