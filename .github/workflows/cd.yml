# yamllint disable rule:line-length
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: "Promote the latest commit to production?"
        type: boolean
        default: false

concurrency:
  group: pagasys-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  migrate:
    needs: lint-and-test
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Run migrations in VPC
        id: run-migrations
        run: |
          # 1) Fail early if any secret is missing (runner side)
          : "${DB_HOST:?DB_HOST missing}"; : "${DB_PORT:?DB_PORT missing}"
          : "${DB_NAME:?DB_NAME missing}"; : "${DB_USER:?DB_USER missing}"; : "${DB_PASSWORD:?DB_PASSWORD missing}"

          # 2) Write the remote script locally (SECRETS EXPAND HERE on the runner)
          cat >/tmp/remote-migrate.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep -E 'web|django' | head -n1)

          if ! docker ps -q -f "name=${CONTAINER_NAME}" | grep -q .; then
            echo "Container ${CONTAINER_NAME} not running"; exit 1
          fi

          # Run inside the app container with DB_* env vars
          docker exec -i \
            -e DB_HOST="${DB_HOST}" \
            -e DB_PORT="${DB_PORT}" \
            -e DB_NAME="${DB_NAME}" \
            -e DB_USER="${DB_USER}" \
            -e DB_PASSWORD="${DB_PASSWORD}" \
            "${CONTAINER_NAME}" sh -s <<'INNER'
          set -e

          cd /app || { echo "App directory not found in container"; exit 1; }

          # Try to install DNS tools depending on base image
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bind-tools
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y dnsutils >/dev/null
          elif command -v yum >/dev/null 2>&1; then
            yum install -y bind-utils >/dev/null
          fi

          nslookup www.google.com >/dev/null || { echo "Public DNS broken"; exit 1; }
          nslookup "$DB_HOST"     >/dev/null || { echo "DB_HOST does not resolve: $DB_HOST"; exit 1; }

          python - <<'PY'
          import os, socket, sys, time
          host = os.environ.get("DB_HOST")
          port = int(os.environ.get("DB_PORT", "5432"))
          if not host:
              print("DB_HOST is not set"); sys.exit(1)
          for _ in range(30):
              try:
                  socket.create_connection((host, port), timeout=5).close()
                  print("Database is reachable"); break
              except socket.gaierror:
                  print("DB_HOST does not resolve"); sys.exit(1)
              except OSError as e:
                  print(f"Waiting for database: {e}"); time.sleep(2)
          else:
              print("Database not reachable"); sys.exit(1)
          PY

          python manage.py migrate --noinput --verbosity 2
          INNER
          BASH
          chmod +x /tmp/remote-migrate.sh

          # 3) Base64-encode it so JSON/SSM can’t mangle it
          REMOTE_B64=$(base64 -w0 /tmp/remote-migrate.sh || base64 /tmp/remote-migrate.sh)

          # 4) Build SSM parameters: reconstruct the script on the instance and run it
          jq -n --arg b "$REMOTE_B64" --arg host "$DB_HOST" --arg port "$DB_PORT" --arg name "$DB_NAME" --arg user "$DB_USER" --arg pass "$DB_PASSWORD" '{
            commands: [
              "set -e",
              "echo \"$b\" | base64 -d > /tmp/remote-migrate.sh",
              "chmod +x /tmp/remote-migrate.sh",
              # Pass DB_* to the script as env on the EC2 host (will be forwarded into docker exec)
              "DB_HOST=\"\($host)\" DB_PORT=\"\($port)\" DB_NAME=\"\($name)\" DB_USER=\"\($user)\" DB_PASSWORD=\"\($pass)\" /tmp/remote-migrate.sh"
            ]
          }' >/tmp/ssm-params.json

          # 5) Send command
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:elasticbeanstalk:environment-name,Values=pagasys-development" \
            --document-name "AWS-RunShellScript" \
            --comment "Run Django migrations" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

  migrate-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_prod == true
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment: pagasys-prod
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Run migrations in VPC (production)
        run: |
          # same body as your migrate job,
          # but change the SSM target to pagasys-prod
          : "${DB_HOST:?}"; : "${DB_PORT:?}"; : "${DB_NAME:?}"; : "${DB_USER:?}"; : "${DB_PASSWORD:?}"

          cat >/tmp/remote-migrate.sh <<'BASH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep -E 'web|django' | head -n1)
          if ! docker ps -q -f "name=${CONTAINER_NAME}" | grep -q .; then
            echo "Container ${CONTAINER_NAME} not running"; exit 1
          fi
          docker exec -i \
            -e DB_HOST="${DB_HOST}" -e DB_PORT="${DB_PORT}" -e DB_NAME="${DB_NAME}" \
            -e DB_USER="${DB_USER}" -e DB_PASSWORD="${DB_PASSWORD}" \
            "${CONTAINER_NAME}" sh -s <<'INNER'
          set -e
          cd /app || exit 1
          python - <<'PY'
          import os, socket, sys, time
          host = os.environ["DB_HOST"]; port = int(os.environ.get("DB_PORT","5432"))
          for _ in range(30):
              try: socket.create_connection((host, port), timeout=5).close(); break
              except OSError as e: print(f"Waiting for database: {e}"); time.sleep(2)
          else: sys.exit("Database not reachable")
          PY
          python manage.py migrate --noinput --verbosity 2
          INNER
          BASH
          chmod +x /tmp/remote-migrate.sh

          REMOTE_B64=$(base64 -w0 /tmp/remote-migrate.sh || base64 /tmp/remote-migrate.sh)

          jq -n --arg b "$REMOTE_B64" --arg host "$DB_HOST" --arg port "$DB_PORT" --arg name "$DB_NAME" --arg user "$DB_USER" --arg pass "$DB_PASSWORD" '{
            commands: [
              "set -e",
              "echo \"$b\" | base64 -d > /tmp/remote-migrate.sh",
              "chmod +x /tmp/remote-migrate.sh",
              "DB_HOST=\"\($host)\" DB_PORT=\"\($port)\" DB_NAME=\"\($name)\" DB_USER=\"\($user)\" DB_PASSWORD=\"\($pass)\" /tmp/remote-migrate.sh"
            ]
          }' >/tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:elasticbeanstalk:environment-name,Values=pagasys-prod" \
            --document-name "AWS-RunShellScript" \
            --comment "Run Django migrations (prod)" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "command_id=$COMMAND_ID"

  deploy-to-eb:
    name: Deploy to Elastic Beanstalk
    needs: [lint-and-test, migrate]
    runs-on: ubuntu-latest
    environment: pagasys-development
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Wait for EB environment to be ready
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-development --query 'Environments[0].Status' --output text)
          while [ "$STATUS" != "Ready" ]; do
            echo "Environment status: $STATUS. Waiting..."
            sleep 20
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-development --query 'Environments[0].Status' --output text)
          done
          echo "Environment is Ready."

      - name: Get current EB version
        id: prev-version
        run: |
          PREV_VERSION=$(aws elasticbeanstalk describe-environments --environment-names pagasys-development --query 'Environments[0].VersionLabel' --output text)
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT

      - name: Use EB compose file
        run: mv docker-compose.eb.yml docker-compose.yml

      - name: Package application
        run: zip -r deployment-package.zip . -x '*.git*' '*.venv*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: pagasys-development
          environment_name: pagasys-development
          version_label: ${{ github.sha }}
          region: me-central-1
          deployment_package: deployment-package.zip

      - name: Wait for deployment to finish
        run: aws elasticbeanstalk wait environment-updated --environment-name pagasys-development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (HTTP + DB in VPC)
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail

          # 1) App HTTP health check from outside (runner) — REQUIRE 200
          URL=$(aws elasticbeanstalk describe-environments \
            --environment-names pagasys-development \
            --query "Environments[0].CNAME" --output text)

          CODE=""
          for i in {1..18}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-redirs 0 "http://$URL/healthz" || true)
            echo "HTTP /healthz -> $CODE ($i/18)"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "HTTP health check failed with code=$CODE"; exit 1; }

          # 2) DB check INSIDE the VPC (on the EB instance, in the web container)
          cat >/tmp/db-check.sh <<'BASH'
          #!/usr/bin/env bash
          set -e
          CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep -E 'web|django' | head -n1)
          if ! docker ps -q -f "name=${CONTAINER_NAME}" | grep -q .; then
            echo "Container ${CONTAINER_NAME} not running"; exit 1
          fi
          docker exec -i "${CONTAINER_NAME}" sh -lc '
            cd /app || exit 1
            python manage.py shell -c "from django.db import connection; connection.cursor().execute(\"SELECT 1\"); print(\"DB OK\")"
          '
          BASH
          chmod +x /tmp/db-check.sh

          DB_B64=$(base64 -w0 /tmp/db-check.sh || base64 /tmp/db-check.sh)

          jq -n --arg b "$DB_B64" '{commands: [
            "set -e",
            "echo \"$b\" | base64 -d > /tmp/db-check.sh",
            "chmod +x /tmp/db-check.sh",
            "/tmp/db-check.sh"
          ]}' >/tmp/ssm-db.json

          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:elasticbeanstalk:environment-name,Values=pagasys-development" \
            --document-name "AWS-RunShellScript" \
            --comment "Smoke test DB check" \
            --parameters file:///tmp/ssm-db.json \
            --query "Command.CommandId" --output text)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=pagasys-development" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          for i in {1..60}; do
            INV=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID")
            STATUS=$(echo "$INV" | jq -r .Status)
            if [[ "$STATUS" =~ ^(InProgress|Pending|Delayed)$ ]]; then
              echo "DB check status: $STATUS. Waiting... ($i/60)"
              sleep 5
              continue
            fi
            echo "DB check completed with status: $STATUS"
            echo "STDOUT:"; echo "$INV" | jq -r .StandardOutputContent
            echo "STDERR:"; echo "$INV" | jq -r .StandardErrorContent
            [ "$STATUS" = "Success" ] && exit 0 || exit 1
          done

          echo "DB check timed out"
          exit 1

      - name: Roll back on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Rolling back to version: ${{ steps.prev-version.outputs.version }}"
          aws elasticbeanstalk update-environment --environment-name pagasys-development --version-label "${{ steps.prev-version.outputs.version }}"
          aws elasticbeanstalk wait environment-updated --environment-name pagasys-development

      - name: Fail workflow if smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  deploy-to-eb-prod:
    name: Deploy to Elastic Beanstalk (prod)
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_prod == true
    needs: [ lint-and-test, migrate-prod ]
    runs-on: ubuntu-latest
    environment: pagasys-prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: me-central-1

      - name: Wait for EB environment to be ready (prod)
        run: |
          ENV=pagasys-prod
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" --query 'Environments[0].Status' --output text)
          while [ "$STATUS" != "Ready" ]; do
            echo "Environment status: $STATUS. Waiting..."
            sleep 20
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" --query 'Environments[0].Status' --output text)
          done

      - name: Get current EB version (prod)
        id: prev-version
        run: |
          ENV=pagasys-prod
          PREV_VERSION=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" --query 'Environments[0].VersionLabel' --output text)
          echo "version=$PREV_VERSION" >> $GITHUB_OUTPUT

      - name: Use EB compose file
        run: mv docker-compose.eb.yml docker-compose.yml

      - name: Package application
        run: zip -r deployment-package.zip . -x '*.git*' '*.venv*'

      - name: Deploy to Elastic Beanstalk (prod)
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: pagasys-prod
          environment_name: pagasys-prod
          version_label: ${{ github.sha }}
          region: me-central-1
          deployment_package: deployment-package.zip

      - name: Wait for deployment to finish
        run: aws elasticbeanstalk wait environment-updated --environment-name pagasys-prod

      - name: Smoke test (HTTP + DB in VPC, prod)
        id: smoke
        continue-on-error: true
        run: |
          set -euo pipefail
          ENV=pagasys-prod
          URL=$(aws elasticbeanstalk describe-environments --environment-names "$ENV" --query "Environments[0].CNAME" --output text)

          # REQUIRE 200 on /healthz (no redirects)
          CODE=""
          for i in {1..18}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-redirs 0 "http://$URL/healthz" || true)
            echo "HTTP /healthz -> $CODE ($i/18)"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          [ "$CODE" = "200" ] || { echo "HTTP health check failed with code=$CODE"; exit 1; }

          # DB check from inside the VPC / app container
          cat >/tmp/db-check.sh <<'BASH'
          #!/usr/bin/env bash
          set -e
          CONTAINER_NAME=$(docker ps --format '{{.Names}}' | grep -E 'web|django' | head -n1)
          [ -n "$CONTAINER_NAME" ] || { echo "No app container"; exit 1; }
          docker exec -i "$CONTAINER_NAME" sh -lc '
            cd /app || exit 1
            python manage.py shell -c "from django.db import connection; connection.cursor().execute(\"SELECT 1\"); print(\"DB OK\")"
          '
          BASH
          chmod +x /tmp/db-check.sh
          DB_B64=$(base64 -w0 /tmp/db-check.sh || base64 /tmp/db-check.sh)
          jq -n --arg b "$DB_B64" '{commands:["set -e","echo \"$b\" | base64 -d > /tmp/db-check.sh","chmod +x /tmp/db-check.sh","/tmp/db-check.sh"]}' >/tmp/ssm-db.json
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:elasticbeanstalk:environment-name,Values=pagasys-prod" \
            --document-name "AWS-RunShellScript" \
            --comment "Smoke test DB check (prod)" \
            --parameters file:///tmp/ssm-db.json \
            --query "Command.CommandId" --output text)

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:elasticbeanstalk:environment-name,Values=pagasys-prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          for i in {1..60}; do
            INV=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID")
            STATUS=$(echo "$INV" | jq -r .Status)
            [[ "$STATUS" =~ ^(InProgress|Pending|Delayed)$ ]] && { echo "DB check: $STATUS ($i/60)"; sleep 5; continue; }
            echo "DB check completed: $STATUS"
            echo "$INV" | jq -r .StandardOutputContent
            [ "$STATUS" = "Success" ] && exit 0 || exit 1
          done
          echo "DB check timed out"; exit 1

      - name: Roll back on smoke failure (prod)
        if: steps.smoke.outcome == 'failure'
        run: |
          aws elasticbeanstalk update-environment --environment-name pagasys-prod --version-label "${{ steps.prev-version.outputs.version }}"
          aws elasticbeanstalk wait environment-updated --environment-name pagasys-prod
          exit 1
