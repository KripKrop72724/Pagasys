name: CI/CD

on:
  push:
    branches: [ main ]

concurrency:
  group: pagasys-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests
        run: pytest -q --disable-warnings --maxfail=1

  deploy-to-eb:
    name: Deploy to Elastic Beanstalk
    needs: lint-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:           me-central-1

      - name: Generate EB environment variables
        run: python scripts/eb_env.py --names "DB_HOST,DB_NAME,DB_USER,DB_PASSWORD" --output eb-env.json
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Wait for EB environment to be ready
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-dev-env --query 'Environments[0].Status' --output text)
          while [ "$STATUS" != "Ready" ]; do
            echo "Environment status: $STATUS. Waiting..."
            sleep 20
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names pagasys-dev-env --query 'Environments[0].Status' --output text)
          done
          echo "Environment is Ready."

      - name: Inject EB environment variables
        run: aws elasticbeanstalk update-environment --environment-name pagasys-dev-env --option-settings file://eb-env.json

      - name: Wait for environment update
        run: aws elasticbeanstalk wait environment-updated --environment-name pagasys-dev-env

      - name: Package application
        run: zip -r deployment-package.zip . -x '*.git*' '*.venv*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key:     ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name:   pagasys-dev
          environment_name:   pagasys-dev-env
          version_label:      ${{ github.sha }}
          region:             me-central-1
          deployment_package: deployment-package.zip

      - name: Wait for deployment to finish
        run: aws elasticbeanstalk wait environment-updated --environment-name pagasys-dev-env

      - name: Smoke test
        run: |
          URL=$(aws elasticbeanstalk describe-environments \
            --environment-names pagasys-dev-env \
            --query "Environments[0].CNAME" --output text)
          curl --fail http://$URL/healthz
